name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: bun run lint
      - run: bun run format:check
      - name: Verify npm package boundaries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'touhou-tagger.tgz'
          bun pm pack --filename $archive --ignore-scripts --quiet
          if ($LASTEXITCODE -ne 0) {
            throw 'bun pm pack failed.'
          }
          $entries = @(tar -tf $archive)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the npm package.'
          }
          $forbidden = @($entries | Where-Object {
            $_ -match '^package/(fixtures|test|go)(/|$)'
          })
          if ($forbidden.Count -gt 0) {
            throw "Forbidden npm package entries: $($forbidden -join ', ')"
          }
  go:
    name: Go
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          working-directory: go
          args: --config .golangci.yml
      - name: Test
        working-directory: go
        run: go test ./...
      - name: Build CLI
        working-directory: go
        run: go build -trimpath -o ./bin/thtag.exe ./cmd/thtag

  gui:
    name: GUI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          if ($LASTEXITCODE -ne 0) {
            throw 'Wails CLI installation failed.'
          }
          Join-Path (go env GOPATH) bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend dependencies
        working-directory: go/gui/frontend
        run: bun install --frozen-lockfile
      - name: Build Windows amd64 GUI
        working-directory: go/gui
        run: wails3 build GOOS=windows GOARCH=amd64
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath go/bin/TouhouTagger.exe)) {
            throw 'go/bin/TouhouTagger.exe was not built.'
          }
