name: Windows Release Assets

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-go:
    name: Package Go CLI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build Go CLI
        working-directory: go
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { git describe --tags --always }
          $commit = git rev-parse --short HEAD
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          go build -trimpath -ldflags "-X main.version=$version -X main.commit=$commit -X main.date=$date" -o ./bin/thtag.exe ./cmd/thtag
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: go/bin/thtag.exe
          archive: false
          if-no-files-found: error

  package-gui:
    name: Package GUI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: go/gui/frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install GUI frontend dependencies
        working-directory: go/gui/frontend
        run: pnpm install --frozen-lockfile
      - name: Build GUI
        working-directory: go/gui
        run: go tool wails3 task build
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: go/bin/TouhouTagger.exe
          archive: false
          if-no-files-found: error

  publish-release:
    name: Upload Release Assets
    if: github.event_name == 'release'
    needs: [package-go, package-gui]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload executables
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release-assets -Filter *.exe | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset $($_.Name)."
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
