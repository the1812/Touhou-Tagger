name: WASM

on:
  push:
    paths:
      - .github/workflows/wasm.yml
      - example.jpg
      - go/go.mod
      - go/go.sum
      - go/wasm-src/**
      - go/internal/imagecodec/**
  pull_request:
    paths:
      - .github/workflows/wasm.yml
      - example.jpg
      - go/go.mod
      - go/go.sum
      - go/wasm-src/**
      - go/internal/imagecodec/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: WASM
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Rebuild pinned WASM assets
        shell: pwsh
        run: ./go/wasm-src/build.ps1
      - name: Build CLI with rebuilt assets
        working-directory: go
        run: go build -trimpath -o "$RUNNER_TEMP/thtag" ./cmd/thtag
      - name: Test image pipeline
        working-directory: go
        run: go test ./internal/imagecodec/...
