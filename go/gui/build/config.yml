version: "3"

info:
  companyName: "Grant Howard"
  productName: "Touhou Tagger Desktop"
  productIdentifier: "io.github.the1812.touhou-tagger"
  description: "Touhou Tagger Desktop"
  copyright: "Copyright Grant Howard"
  comments: "Touhou Tagger Desktop"
  version: "2.3.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .task
      - frontend
      - ../bin
    file:
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go tool wails3 build DEV=true
      type: blocking
    - cmd: go tool wails3 task dev:frontend
      type: background
    - cmd: go tool wails3 task run
      type: primary
