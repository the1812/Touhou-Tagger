version: "3"

vars:
  APP_NAME: TouhouTagger
  BIN_DIR: ../bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOARCH: '{{.GOARCH | default "amd64"}}'

tasks:
  install:frontend:
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/**/*
    cmds:
      - pnpm install --frozen-lockfile

  generate:bindings:
    sources:
      - "*.go"
      - "internal/bridge/**/*.go"
      - ../go.mod
      - ../go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - go tool wails3 generate bindings -clean=true -ts -i

  generate:syso:
    sources:
      - ../../assets/logo.ico
      - build/windows/wails.exe.manifest
      - build/windows/info.json
    generates:
      - resource_windows_{{.GOARCH}}.syso
    cmds:
      - >-
        go tool wails3 generate syso
        -icon ../../assets/logo.ico
        -manifest build/windows/wails.exe.manifest
        -info build/windows/info.json
        -arch {{.GOARCH}}
        -out resource_windows_{{.GOARCH}}.syso

  build:frontend:
    deps:
      - install:frontend
      - generate:bindings
    dir: frontend
    cmds:
      - pnpm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}

  build:
    deps:
      - build:frontend
      - generate:syso
    cmds:
      - >-
        go build
        {{if ne .DEV "true"}}-tags production -trimpath -ldflags="-w -s -H windowsgui"{{else}}-gcflags=all="-l"{{end}}
        -buildvcs=false
        -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        .
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: "{{.GOARCH}}"

  dev:frontend:
    deps:
      - install:frontend
    dir: frontend
    cmds:
      - pnpm run dev -- --port {{.VITE_PORT}} --strictPort

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'

  dev:
    cmds:
      - go tool wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
