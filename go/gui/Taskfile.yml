version: "3"

vars:
  APP_NAME: TouhouTagger
  BIN_DIR: ../bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOARCH: '{{.GOARCH | default "amd64"}}'
  WAILS_VERSION: v3.0.0-alpha2.117
  WAILS_CLI: "{{.TASKFILE_DIR}}/.task/bin/wails3.exe"

tasks:
  install:wails:
    sources:
      - Taskfile.yml
    generates:
      - .task/bin/wails3.exe
    cmds:
      - go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}
    env:
      GOBIN: "{{.TASKFILE_DIR}}/.task/bin"

  install:frontend:
    dir: frontend
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/**/*
    cmds:
      - bun install --frozen-lockfile

  generate:bindings:
    deps:
      - install:wails
    sources:
      - "*.go"
      - "internal/bridge/**/*.go"
      - ../go.mod
      - ../go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - '"{{.WAILS_CLI}}" generate bindings -clean=true -ts -i'

  generate:syso:
    deps:
      - install:wails
    sources:
      - ../../assets/logo.ico
      - build/windows/wails.exe.manifest
      - build/windows/info.json
    generates:
      - resource_windows_{{.GOARCH}}.syso
    cmds:
      - >-
        "{{.WAILS_CLI}}" generate syso
        -icon ../../assets/logo.ico
        -manifest build/windows/wails.exe.manifest
        -info build/windows/info.json
        -arch {{.GOARCH}}
        -out resource_windows_{{.GOARCH}}.syso

  build:frontend:
    deps:
      - install:frontend
      - generate:bindings
    dir: frontend
    cmds:
      - bun run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}

  build:
    deps:
      - build:frontend
      - generate:syso
    cmds:
      - >-
        powershell.exe -NoProfile -NonInteractive -Command
        "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
      - >-
        go build
        {{if ne .DEV "true"}}-tags production -trimpath -ldflags="-w -s -H windowsgui"{{else}}-gcflags=all="-l"{{end}}
        -buildvcs=false
        -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        .
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: "{{.GOARCH}}"

  dev:frontend:
    deps:
      - install:frontend
    dir: frontend
    cmds:
      - bun run dev -- --port {{.VITE_PORT}} --strictPort

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'

  dev:
    deps:
      - install:wails
    cmds:
      - '"{{.WAILS_CLI}}" dev -config ./build/config.yml -port {{.VITE_PORT}}'
